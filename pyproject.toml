[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clef-finetune"
version = "0.1.0"
description = "LoRA fine-tuning toolkit for Cloudflare's open-source Clef / Clef-flash decision models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Mersiv Media", email = "contact@mersivmedia.com" }]
keywords = ["clef", "clef-flash", "cloudflare", "fine-tuning", "lora", "peft", "decision-models", "qwen", "insurance", "compliance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.6",
  "transformers>=5.10.2",
  "peft>=0.17",
  "safetensors",
  "huggingface_hub",
  "pyyaml",
  "pillow",
  "torchvision",
  "accelerate",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/MersivMedia/clef-finetune"
Issues = "https://github.com/MersivMedia/clef-finetune/issues"
"Known issues" = "https://github.com/MersivMedia/clef-finetune/blob/main/docs/KNOWN_ISSUES.md"

[project.scripts]
clef-finetune = "clef_finetune.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clef_finetune = ["_vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
