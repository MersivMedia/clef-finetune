[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clef-finetune"
version = "0.1.0"
description = "LoRA fine-tuning toolkit for Cloudflare's open-source Clef / Clef-flash decision models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Mersiv Media", email = "contact@mersivmedia.com" }]
dependencies = [
  "torch>=2.6",
  "transformers>=5.10.2",
  "peft>=0.17",
  "safetensors",
  "huggingface_hub",
  "pyyaml",
  "pillow",
  "torchvision",
  "accelerate",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
clef-finetune = "clef_finetune.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clef_finetune = ["_vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
