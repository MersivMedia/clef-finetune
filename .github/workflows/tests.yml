name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      CLEF_FINETUNE_JSM: vendored   # offline: use the vendored, unmodified joint_schema_model.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU torch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Unit tests + tiny random-model end-to-end (train, resume, eval, merge round-trip)
        run: pytest -q -s
