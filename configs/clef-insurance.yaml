# Starting-point config for Clef (27B) on one H200 (141 GB) or 2x80 GB, bf16 LoRA.
# UNTESTED on GPU so far -- see docs/KNOWN_ISSUES.md.
model:
  path: Cloudflare/clef        # or a local release dir
  revision: 2f3de3dd85f379784083b0814d997ab627200f0c
  dtype: bfloat16
data:
  train: ../examples/insurance-claims/train.synthetic.jsonl   # replace with your real data
  eval: ../examples/insurance-claims/eval.synthetic.jsonl
  max_length: 8192
augment:
  shuffle_questions: true
  question_subset_prob: 0.3
  paraphrase_prob: 0.5
  rename_option_prob: 0.3
  criteria_dropout_prob: 0.1
  templates_file: ../examples/insurance-claims/paraphrases.yaml
lora:
  r: 64          # Cloudflare used rank 256 for their own post-training
  alpha: 128
  dropout: 0.05
  # include_suffixes: [q_proj, k_proj, v_proj, o_proj, in_proj_qkv, in_proj_z, out_proj]  # default: all text Linear layers
train:
  seed: 0
  max_steps: 500
  grad_accum: 16
  lr: 1.0e-4
  head_lr: 5.0e-5
  warmup_steps: 20
  label_smoothing: 0.05
  brier_weight: 1.0
  ordinal_weight: 0.5
  train_head: true
  head_dtype: float32
  gradient_checkpointing: true
  save_every: 100
output_dir: runs/clef-insurance
